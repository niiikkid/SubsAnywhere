<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Мой словарь — SubsAnywhere</title>
  <link rel="stylesheet" href="/words/words.css">
  <script src="/words/words.js" defer></script>
</head>
<body>
  <header class="site-header"><span class="brand">SubsAnywhere</span><span class="local-label">Словарь</span></header>
  <main>
    <section class="vocabulary" aria-label="Сохранённые слова">
      <div class="toolbar">
        <input id="search" type="search" aria-label="Поиск по слову, пиньиню или переводу" placeholder="Поиск по слову, пиньиню или переводу" autocomplete="off" maxlength="1000">
        <select id="language" aria-label="Язык">
          <option value="">Все языки</option><option value="zh">Китайский</option><option value="en">Английский</option>
        </select>
        <button id="refresh" type="button">Обновить</button>
      </div>
      <div class="list-heading"><h2>На повторение</h2><span id="count" aria-live="polite">—</span></div>
      <p id="status" class="status" role="status" aria-live="polite">Загрузка словаря…</p>
      <ul id="word-list" aria-label="Слова" aria-busy="true"></ul>
      <div id="empty" class="empty" hidden></div>
      <noscript><p class="empty">Для поиска и удаления слов включите JavaScript. Слова останутся на сервере.</p></noscript>
    </section>
    <footer>Слова хранятся на вашем локальном сервере. Никаких облачных запросов с этой страницы.</footer>
  </main>
</body>
</html>
