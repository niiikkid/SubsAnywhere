[project]
name = "subsanywhere-server"
version = "0.9.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "funasr==1.4.5",
  "modelscope==1.39.1",
  "numpy==2.2.6",
  "pypinyin==0.55.0",
  "soundfile==0.13.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==4.57.6",
  "yt-dlp[default]==2026.8.19",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
