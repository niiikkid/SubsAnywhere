<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>SubsAnywhere</title>
</head>
<body>
  <main>
    <header class="app-header">
      <nav class="section-tabs" role="tablist" aria-label="Разделы расширения">
        <button id="playerTab" type="button" role="tab" aria-controls="playerPanel" aria-selected="true">Видео</button>
        <button id="appearanceTab" type="button" role="tab" aria-controls="appearancePanel" aria-selected="false" tabindex="-1">Внешний вид</button>
        <button id="settingsTab" type="button" role="tab" aria-controls="settingsPanel" aria-selected="false" tabindex="-1">Настройки</button>
      </nav>
      <div class="panel-window-controls" hidden>
        <button id="panelDock" type="button" title="Встроить справа" aria-label="Встроить справа" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3h6l-1 5 3 3H5l3-3-1-5Zm3 8v6"/></svg>
        </button>
        <button id="panelClose" type="button" title="Закрыть" aria-label="Закрыть">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </div>
    </header>
    <div class="save-feedback">
      <p id="saveStatus" role="status" aria-live="polite"></p>
      <button id="retrySave" type="button" hidden>Повторить сохранение</button>
      <button id="retrySettings" type="button" hidden>Загрузить настройки снова</button>
    </div>
    <section id="controls">
    <section id="playerPanel" role="tabpanel" aria-labelledby="playerTab">
      <section class="control-card video-card">
        <div class="section-heading">
          <h2 id="videoConnection">Видео не подключено</h2>
          <button id="changeVideo" type="button" class="text-button" aria-controls="videoOptions" aria-expanded="false" hidden>Изменить</button>
        </div>
        <p id="videoTitle" class="video-title" hidden></p>
        <p id="status" class="hint" role="status" aria-live="polite"></p>
        <button id="activate" type="button" class="primary">Найти видео</button>
        <div id="videoOptions" class="workspace-options" hidden>
          <label id="playerChoice">Видео на странице
            <select id="player"></select>
          </label>
          <button id="restartSearch" type="button" class="restart-search">Найти видео заново</button>
        </div>
      </section>

      <section class="control-card captions-card">
        <h2>Субтитры</h2>
        <p id="captionTitle" class="caption-title">Субтитры не выбраны</p>
        <p id="captionSource" class="caption-source" hidden></p>
        <p id="captionState" class="hint" role="status" aria-live="polite"></p>
        <div class="workspace-actions" id="otherSubtitleActions">
          <button id="changeSubtitles" type="button" aria-controls="subtitleOptions" aria-expanded="false">Другие субтитры</button>
        </div>

        <section id="youtubeActions" class="language-tracks" aria-label="Язык субтитров" hidden>
          <button id="englishSubtitles" type="button" class="language-track" aria-pressed="false">
            <span>Английский</span><span id="englishSubtitleState" class="language-state">Скачать и показать</span>
          </button>
          <button id="chineseSubtitles" type="button" class="language-track" aria-pressed="false">
            <span>Китайский</span><span id="chineseSubtitleState" class="language-state">Скачать и показать</span>
          </button>
        </section>
        <section id="youtubeSubtitles" hidden>
          <p id="youtubeSubtitleStatus" class="hint" role="status" aria-live="polite"></p>
        </section>
        <div class="workspace-actions">
          <button id="showTiming" type="button" class="text-button" aria-controls="syncBox" aria-expanded="false" hidden>Сдвиг</button>
          <button id="hideSubtitles" type="button" class="text-button" hidden>Выключить</button>
        </div>

        <div id="subtitleOptions" class="workspace-options" hidden>
          <label>Показывать
            <select id="originalTrack"></select>
          </label>
          <label class="file-button">Добавить файл SRT
            <input id="subtitleFile" type="file" accept=".srt,application/x-subrip,text/plain">
          </label>


        </div>

        <section id="syncBox" class="workspace-options sync-box" hidden>
          <p id="syncTrackName" class="hint" hidden></p>
          <div class="two-columns">
            <label>Смещение, сек.
              <input id="offsetSeconds" type="number" min="-3600" max="3600" step="0.1" value="0" title="Минус - показать раньше, плюс - позже">
            </label>
            <label hidden>Скорость, %
              <input id="timeScalePercent" type="number" min="90" max="110" step="0.001" value="100">
            </label>
          </div>
          <div class="sync-buttons" aria-label="Изменить смещение">
            <button type="button" data-shift="-5">−5</button>
            <button type="button" data-shift="-1">−1</button>
            <button type="button" data-shift="-0.1">−0,1</button>
            <button type="button" data-shift="0.1">+0,1</button>
            <button type="button" data-shift="1">+1</button>
            <button type="button" data-shift="5">+5</button>
          </div>

        </section>
      </section>

    </section>
      <section id="appearancePanel" role="tabpanel" aria-labelledby="appearanceTab" class="control-card appearance-card" hidden>
        <div class="preview-scene" aria-label="Пример внешнего вида субтитров">
          <span class="preview-label">ПРЕДПРОСМОТР</span>
          <span id="subtitlePreview">One line at a time.</span>
        </div>

        <label class="toggle-control">
          <input id="inlineTranslations" type="checkbox">
          Переводы над фразами
        </label>

        <label class="toggle-control">
          <input id="showOriginalWithInline" type="checkbox">
          Отдельная строка оригинала под ячейками
        </label>
        <div class="appearance-sliders">
          <label>Оригинал <output id="fontSizeValue"></output>
            <input id="fontSize" type="range" min="12" max="48" value="24">
          </label>
          <label>Полный перевод <output id="translationFontSizeValue"></output>
            <input id="translationFontSize" type="range" min="8" max="48" value="14">
          </label>
          <label>Переводы в ячейках <output id="inlineTranslationFontSizeValue"></output>
            <input id="inlineTranslationFontSize" type="range" min="8" max="48" value="10">
          </label>
          <label>Непрозрачность фона <output id="subtitleBackgroundOpacityValue"></output>
            <input id="subtitleBackgroundOpacity" type="range" min="10" max="100" value="100">
          </label>
        </div>
        <div class="two-columns">
          <label>Цвет текста
            <input id="subtitleColor" type="color" value="#ffffff">
          </label>
          <label>Цвет фона
            <input id="subtitleBackgroundColor" type="color" value="#000000">
          </label>
        </div>

        <label class="toggle-control">
          <input id="subtitleBackground" type="checkbox" checked>
          Показывать фон
        </label>
      </section>

      <section id="settingsPanel" role="tabpanel" aria-labelledby="settingsTab" class="compact-settings" hidden>
        <section id="aiSettingsPanel">
          <section class="control-card ai-settings">
            <div class="section-heading">
              <h2>Перевод через ИИ</h2>
            </div>
            <div class="two-columns">
              <label>Сервис
                <select id="aiProvider">
                  <option value="deepseek">DeepSeek</option>
                  <option value="openai">OpenAI</option>
                </select>
              </label>
              <label>Модель
                <select id="aiModel" disabled></select>
              </label>
            </div>
            <label><span id="aiKeyLabel">API-ключ DeepSeek</span>
              <input id="aiKey" type="password" autocomplete="new-password" placeholder="Вставьте ключ">
            </label>
            <p id="aiModelHint" class="hint">Сначала сохраните ключ.</p>
            <div class="button-row">
              <button id="loadAiModels" type="button" title="Сохранить ключ и загрузить модели">Ключ и модели</button>
              <button id="clearAiKey" type="button" class="danger-text">Удалить ключ</button>
            </div>
            <button id="saveAiSettings" type="button" class="primary settings-save" disabled>Использовать модель</button>
            <p id="aiKeyState" class="hint"></p>
          </section>
        </section>


      </section>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
